[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viaverde-traffic"
version = "0.1.1"
description = "Python wrapper for Via Verde traffic camera images"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Miguel"}
]
keywords = [
    "viaverde",
    "traffic",
    "cameras",
    "portugal",
    "highway",
    "api",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics :: Capture",
]

dependencies = [
    "requests>=2.25.0",
]

[project.optional-dependencies]
pil = [
    "Pillow>=8.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-requests>=2.28.0",
]
all = [
    "viaverde-traffic[pil,dev]",
]

[project.urls]
Homepage = "https://github.com/mpoboas/viaverde-traffic-api"
Documentation = "https://github.com/mpoboas/viaverde-traffic-api#readme"
Repository = "https://github.com/mpoboas/viaverde-traffic-api"
Issues = "https://github.com/mpoboas/viaverde-traffic-api/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["viaverde_traffic*"]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=viaverde_traffic --cov-report=term-missing"
